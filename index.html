    <header>

    <main>
        <section class="accueil-introduction">
            <div>
                <h1> NINCEKON <br> YORO ZANDE </h1>
                <p>
                    Apprendre, créer, sécuriser : je vous accompagne dans 
                    la maîtrise des <em>technologies numériques</em> et l'éveil de 
                    votre <em>potentiel musical</em>.
                </p>
                <a href="#contact" class="cta"> BESOIN D'AIDE ? </a>
            </div>
            <img src="./assets/images/mini-nyz-solo.png" alt="Portrait avec effet de la photographe Robbie Lens" />
        </section>
        <section class="accueil-photos">
            <h2>Mes champs d'action</h2>
            <div>
                <img src="./assets/images/accueil/element-1.png" alt="Twelve apostles - Australie" />
                <img src="./assets/images/accueil/element-2.png" alt="Wai-O-Tapu - Nouvelle-Zélande" />
                <img src="./assets/images/accueil/element-3.png" alt="Parc National d’Abel Tasman - Nouvelle-Zélande" />

            <div>
                <img src="./assets/images/accueil/element-4.png" alt="Lac Rotorua - Nouvelle-Zélande" />

                <img src="./assets/images/accueil/element-6.png" alt="Lac Wanaka - Nouvelle-Zélande" />
            </div>
        </section>
        <section id="contact" class="section-contact">
            <h2> Contactez-moi ! </h2>
            <form method="post" action="mailto:wilfriedyoro68@gmail.com">
                <div class="form-nom-email">
                    <div class="form-column">
                        <label for="nom">Nom</label>
                        <input type="text" name="nom" id="nom" />
                    </div>
                    <div class="form-column">
                        <label for="email">Email</label>
                        <input type="e-mail" name="email" id="email" />
                    </div>
                </div>
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="10"></textarea>
                <input type="submit" value="ENVOYER" class="cta" />
            </form>
        </section>
